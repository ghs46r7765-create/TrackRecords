async function garminApi(action, payload){
  const res = await fetch("/api/garmin", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, ...payload }),
  });
  let data;
  try{ data = await res.json(); } catch(e){ throw new Error(`Server-Antwort ungültig (Status ${res.status})`); }
  if(!res.ok || data.error){
    throw new Error(data.error || `Anfrage fehlgeschlagen (Status ${res.status})`);
  }
  return data;
}

function garminDurationSec(a){ return a.duration != null ? a.duration : null; }
function garminDistanceKm(a){ return a.distance != null ? a.distance / 1000 : null; }
function garminTypeLabel(a){ return (a.activityType && a.activityType.typeKey) || "unbekannt"; }

function App(){
  const [runs, setRuns] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("liste");
  const [selected, setSelected] = useState(() => new Set());
  const [toast, setToast] = useState(null);
  const [comparisons, setComparisons] = useState([]);
  const [activeComparisonId, setActiveComparisonId] = useState(null);
  const fileRef = useRef(null);
  const restoreFileRef = useRef(null);

  useEffect(() => {
    Promise.all([idbGetAll(), idbGetAllComparisons()]).then(([rs, cs]) => {
      setRuns(rs); setComparisons(cs); setLoaded(true);
    });
  }, []);

  /* Persistente Ortsermittlung: verarbeitet jeweils genau einen Lauf pro
     Effekt-Durchlauf (verhindert überlappende parallele Geocode-Läufe) und
     schreibt das Ergebnis dauerhaft in IndexedDB, sodass es beim nächsten
     Laden der App sofort verfügbar ist und nie erneut angefragt wird. */
  useEffect(() => {
    if(!loaded) return;
    const target = runs.find(r => r.route && r.route[0] && r.location === undefined);
    if(!target) return;
    let cancelled = false;
    (async () => {
      const lat = target.route[0].lat, lon = target.route[0].lon;
      const key = lat.toFixed(3) + "," + lon.toFixed(3);
      let label;
      if(geocodeCache.has(key)){
        label = geocodeCache.get(key);
      } else {
        try{
          const data = await queueGeocodeRequest(lat, lon);
          label = deriveLocationLabel(data);
          geocodeCache.set(key, label);
        } catch(e){
          label = null;
        }
      }
      if(cancelled) return;
      const updated = { ...target, location: label };
      try{ await idbPutMany([updated]); } catch(e){ /* ignorieren, wird beim nächsten Mal erneut versucht */ }
      if(cancelled) return;
      setRuns(prev => prev.map(x => x.id === target.id ? updated : x));
    })();
    return () => { cancelled = true; };
  }, [runs, loaded]);

  function showToast(msg){ setToast(msg); setTimeout(() => setToast(null), 4200); }

  async function handleImport(e, importOpts){
    const files = Array.from(e.target.files || []);
    if(files.length === 0) return;
    const opts = importOpts || {};
    try{
      const toSave = [];
      let jsonImported = 0, jsonSkipped = 0, gpxImported = 0, gpxFailed = 0, filteredOut = 0;
      for(const file of files){
        const text = await file.text();
        const isGpx = /\.gpx$/i.test(file.name) || text.trim().startsWith("<?xml") || text.trim().startsWith("<gpx");
        if(isGpx){
          const { run, skippedReason } = parseGPX(text, file.name, opts);
          if(run){
            toSave.push(run); gpxImported++;
          } else if(skippedReason && (skippedReason.includes("Distanz") || skippedReason.includes("kein Lauf"))){
            filteredOut++;
          } else {
            gpxFailed++;
          }
        } else {
          const json = JSON.parse(text);
          const { runs: parsed, skipped } = parseHealthAutoExport(json, opts);
          parsed.forEach(r => toSave.push(r));
          jsonImported += parsed.length;
          const filterSkips = skipped.filter(s => s.reason === "kein Lauf" || s.reason.includes("Distanz")).length;
          filteredOut += filterSkips;
          jsonSkipped += (skipped.length - filterSkips);
        }
      }
      if(toSave.length === 0){
        showToast(`Keine Läufe erkannt${gpxFailed ? ` (${gpxFailed} GPX-Datei(en) ohne gültige Track-Punkte)` : ""}${filteredOut ? `, ${filteredOut} durch Filter ausgeschlossen` : ""}. Format evtl. abweichend — bitte Export prüfen.`);
        return;
      }
      await idbPutMany(toSave);
      const all = await idbGetAll();
      setRuns(all);
      const noRoute = toSave.filter(r => !r.route).length;
      const parts = [];
      if(jsonImported) parts.push(`${jsonImported} aus JSON`);
      if(gpxImported) parts.push(`${gpxImported} aus GPX`);
      showToast(`${toSave.length} Läufe importiert (${parts.join(", ")})${jsonSkipped ? `, ${jsonSkipped} übersprungen` : ""}${filteredOut ? `, ${filteredOut} durch Filter ausgeschlossen` : ""}${noRoute ? `, ${noRoute} ohne GPS-Route` : ""}.`);
    } catch(err){
      showToast("Fehler beim Einlesen: " + err.message);
    } finally {
      if(fileRef.current) fileRef.current.value = "";
    }
  }

  async function deleteRun(id){
    await idbDelete(id);
    setRuns(rs => rs.filter(r => r.id !== id));
    setSelected(s => { const n = new Set(s); n.delete(id); return n; });
  }
  async function clearAll(){
    if(!confirm("Wirklich alle Läufe löschen? Das kann nicht rückgängig gemacht werden.")) return;
    await idbClear();
    setRuns([]); setSelected(new Set());
  }
  /* Garmin-Sitzungstoken (garminAuth) sind bewusst NICHT Teil des Backups:
     Die Backup-Datei wird ggf. per Mail/AirDrop geteilt (siehe shareBackup) —
     ein Auth-Token darin wäre ein Sicherheitsrisiko. Der reine Export-Status
     (welche Garmin-Aktivitäten schon heruntergeladen wurden) ist unkritisch
     und wird für Kontinuität über Geräte hinweg mitgesichert. */
  async function buildBackupPayload(){
    const [garminActivities, garminSync] = await Promise.all([idbGetAllGarminActivities(), idbGetGarminSync()]);
    const payload = { version: 1, exportedAt: new Date().toISOString(), runs, comparisons, garminActivities, garminSync };
    const filename = `laufvergleich-backup-${new Date().toISOString().slice(0,10)}.json`;
    return { payload, filename };
  }
  async function backup(){
    const { payload, filename } = await buildBackupPayload();
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    a.click(); URL.revokeObjectURL(url);
  }

  /* Geräteübertragung: nutzt die native Web-Share-API (Safari iOS 15+), um die
     Backup-Datei direkt per AirDrop, Nachrichten, Mail etc. an ein anderes Gerät
     zu senden — ohne Umweg über "Datei herunterladen -> manuell weiterreichen".
     Auf dem Zielgerät wird die empfangene Datei dann ganz normal über
     "Wiederherstellen" importiert. Fällt auf den klassischen Download zurück,
     wenn die Web-Share-API mit Dateien nicht unterstützt wird (z.B. Desktop-
     Browser) oder das Teilen aus einem anderen Grund als Nutzerabbruch fehlschlägt. */
  async function shareBackup(){
    const { payload, filename } = await buildBackupPayload();
    let file;
    try{
      file = new File([JSON.stringify(payload, null, 2)], filename, { type: "application/json" });
    } catch(e){
      backup();
      return;
    }
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({
          files: [file],
          title: "Laufvergleich-Backup",
          text: `${runs.length} Läufe, ${comparisons.length} Vergleiche`,
        });
      } catch(e){
        if(e && e.name !== "AbortError") backup();
      }
    } else {
      backup();
      showToast("Direktes Teilen wird hier nicht unterstützt — Datei wurde stattdessen heruntergeladen, bitte manuell weiterreichen (z.B. per AirDrop).");
    }
  }

  /* Restore ist bewusst additiv (Upsert per ID), nicht destruktiv: bestehende
     Läufe/Vergleiche mit gleicher ID werden überschrieben, alles andere bleibt
     erhalten. Ein vollständiges "Zurücksetzen auf Backup-Stand" gibt es nicht,
     um versehentlichen Datenverlust durch ein veraltetes Backup zu vermeiden —
     wer wirklich ersetzen will, nutzt vorher "Alle löschen". */
  async function restoreFromBackup(file){
    let text;
    try{ text = await file.text(); } catch(e){ showToast("Backup-Datei konnte nicht gelesen werden."); return; }
    let data;
    try{ data = JSON.parse(text); } catch(e){ showToast("Ungültige Backup-Datei: kein gültiges JSON."); return; }

    let restoredRuns, restoredComparisons = [];
    if(Array.isArray(data)){
      restoredRuns = data; // altes Backup-Format: nur ein Array von Läufen
    } else if(data && Array.isArray(data.runs)){
      restoredRuns = data.runs;
      restoredComparisons = Array.isArray(data.comparisons) ? data.comparisons : [];
    } else {
      showToast("Ungültige Backup-Datei: erwartetes Format nicht erkannt.");
      return;
    }

    const validRuns = restoredRuns.filter(r => r && typeof r.id === "string" && r.start);
    if(validRuns.length === 0){
      showToast("Backup enthält keine gültigen Lauf-Datensätze.");
      return;
    }
    const validComparisons = restoredComparisons.filter(c => c && typeof c.id === "string" && Array.isArray(c.runIds));
    const validGarminActivities = Array.isArray(data && data.garminActivities)
      ? data.garminActivities.filter(g => g && g.activityId != null)
      : [];
    const validGarminSync = (data && data.garminSync && typeof data.garminSync.lastImportDate === "string") ? data.garminSync : null;

    const ok = confirm(
      `${validRuns.length} Läufe${validComparisons.length ? ` und ${validComparisons.length} gespeicherte Vergleiche` : ""} aus dem Backup wiederherstellen?\n\nBestehende Einträge mit gleicher ID werden überschrieben, alle anderen bleiben unverändert erhalten.`
    );
    if(!ok) return;

    await idbPutMany(validRuns);
    if(validComparisons.length) await Promise.all(validComparisons.map(c => idbPutComparison(c)));
    if(validGarminActivities.length) await idbPutGarminActivities(validGarminActivities);
    if(validGarminSync) await idbSetGarminSync(validGarminSync);
    const [allRuns, allComps] = await Promise.all([idbGetAll(), idbGetAllComparisons()]);
    setRuns(allRuns);
    setComparisons(allComps);
    showToast(`Wiederhergestellt: ${validRuns.length} Läufe${validComparisons.length ? `, ${validComparisons.length} Vergleiche` : ""}.`);
  }

  async function handleRestoreFileChange(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    try{
      await restoreFromBackup(file);
    } finally {
      if(restoreFileRef.current) restoreFileRef.current.value = "";
    }
  }

  function toggleSelect(id){
    setSelected(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }

  async function saveComparison(name, notes, forceNew){
    const now = new Date().toISOString();
    if(activeComparisonId && !forceNew){
      const existing = comparisons.find(c => c.id === activeComparisonId);
      const updated = { ...(existing || {}), id: activeComparisonId, name, notes, runIds: [...selected], updatedAt: now, createdAt: (existing && existing.createdAt) || now };
      await idbPutComparison(updated);
      setComparisons(cs => cs.some(c => c.id === updated.id) ? cs.map(c => c.id === updated.id ? updated : c) : [...cs, updated]);
      showToast("Vergleich aktualisiert.");
    } else {
      const id = uid();
      const created = { id, name, notes, runIds: [...selected], createdAt: now, updatedAt: now };
      await idbPutComparison(created);
      setComparisons(cs => [...cs, created]);
      setActiveComparisonId(id);
      showToast("Vergleich gespeichert.");
    }
  }
  function loadComparison(id){
    const c = comparisons.find(x => x.id === id);
    if(!c) return;
    const validIds = c.runIds.filter(rid => runs.some(r => r.id === rid));
    setSelected(new Set(validIds));
    setActiveComparisonId(id);
    if(validIds.length < c.runIds.length){
      showToast(`Vergleich geladen (${c.runIds.length - validIds.length} Lauf/Läufe nicht mehr vorhanden).`);
    }
  }
  async function deleteComparison(id){
    if(!confirm("Diesen gespeicherten Vergleich wirklich löschen?")) return;
    await idbDeleteComparison(id);
    setComparisons(cs => cs.filter(c => c.id !== id));
    if(activeComparisonId === id) setActiveComparisonId(null);
  }
  async function renameComparison(id, currentName){
    const newName = prompt("Neuer Name für diesen Vergleich:", currentName || "");
    if(newName === null) return; // Nutzer hat abgebrochen
    const trimmed = newName.trim();
    const existing = comparisons.find(c => c.id === id);
    if(!existing) return;
    const updated = { ...existing, name: trimmed, updatedAt: new Date().toISOString() };
    await idbPutComparison(updated);
    setComparisons(cs => cs.map(c => c.id === id ? updated : c));
  }
  function closeComparison(){
    setActiveComparisonId(null);
  }

  const sortedRuns = useMemo(() => [...runs].sort((a,b) => new Date(b.start) - new Date(a.start)), [runs]);

  return html`
    <div class="app">
      <header class="top">
        <h1>Laufvergleich</h1>
        <div class="sub">${runs.length} Läufe · lokal gespeichert (IndexedDB)</div>
      </header>
      <nav class="tabs">
        <button class=${tab==="liste"?"active":""} onClick=${() => setTab("liste")}>📋 Läufe</button>
        <button class=${tab==="laenge"?"active":""} onClick=${() => setTab("laenge")}>📏 Ähnliche Länge</button>
        <button class=${tab==="kurse"?"active":""} onClick=${() => setTab("kurse")}>🗺 Kurse</button>
        <button class=${tab==="vergleich"?"active":""} onClick=${() => setTab("vergleich")}>📊 Vergleich <span class="mono" style="color:var(--route-3)">${selected.size ? `(${selected.size})` : ""}</span></button>
        <button class=${tab==="garmin"?"active":""} onClick=${() => setTab("garmin")}>⌚ Garmin</button>
      </nav>
      <main>
        ${!loaded ? html`<div class="empty">Lädt…</div>` : html`
          <div>
          ${tab === "liste" && html`<${ListeTab}
            runs=${sortedRuns} fileRef=${fileRef} onImport=${handleImport}
            onDelete=${deleteRun} onClearAll=${clearAll} onBackup=${backup} onShare=${shareBackup}
            restoreFileRef=${restoreFileRef} onRestoreFileChange=${handleRestoreFileChange}
            selected=${selected} onToggle=${toggleSelect} />`}
          ${tab === "laenge" && html`<${LaengeTab} runs=${sortedRuns} selected=${selected} onToggle=${toggleSelect} onGoCompare=${() => setTab("vergleich")} />`}
          ${tab === "kurse" && html`<${KurseTab} runs=${sortedRuns} selected=${selected} onToggle=${toggleSelect} onGoCompare=${() => setTab("vergleich")} />`}
          ${tab === "vergleich" && html`<${VergleichTab} runs=${runs} selected=${selected} onToggle=${toggleSelect}
            comparisons=${comparisons} activeComparisonId=${activeComparisonId}
            onSave=${(name,notes) => saveComparison(name,notes,false)}
            onSaveAsNew=${(name,notes) => saveComparison(name,notes,true)}
            onLoad=${loadComparison} onDelete=${deleteComparison} onRename=${renameComparison} onClose=${closeComparison} />`}
          ${tab === "garmin" && html`<${GarminTab} showToast=${showToast} />`}
          </div>
        `}
      </main>
      ${toast && html`<div class="toast">${toast}</div>`}
    </div>
  `;
}

function ListeTab({ runs, fileRef, onImport, onDelete, onClearAll, onBackup, onShare, restoreFileRef, onRestoreFileChange, selected, onToggle }){
  const [sortKey, setSortKey] = useState("date");
  const [sortDir, setSortDir] = useState("desc");
  const [onlyRuns, setOnlyRuns] = useState(true);
  const [minKm, setMinKm] = useState("");
  const [maxKm, setMaxKm] = useState("");

  function handleFileChange(e){
    onImport(e, {
      onlyRuns,
      minKm: minKm !== "" ? parseFloat(minKm) : null,
      maxKm: maxKm !== "" ? parseFloat(maxKm) : null,
    });
  }

  function toggleSort(key){
    if(sortKey === key){
      setSortDir(d => d === "asc" ? "desc" : "asc");
    } else {
      setSortKey(key);
      setSortDir(key === "date" ? "desc" : "asc");
    }
  }

  function sortArrow(key){
    return sortKey === key ? (sortDir === "asc" ? " ▲" : " ▼") : "";
  }

  function sortValue(r, key){
    switch(key){
      case "date": { const t = new Date(r.start).getTime(); return isNaN(t) ? 0 : t; }
      case "distance": return r.distanceKm ?? -1;
      case "duration": return r.durationSec ?? -1;
      case "pace": return r.avgPaceSecPerKm ?? -1;
      case "location": return r.location || "";
      case "route": return r.route ? 1 : 0;
      default: return 0;
    }
  }

  const sortedRuns = useMemo(() => {
    const arr = [...runs];
    arr.sort((a,b) => {
      const av = sortValue(a, sortKey), bv = sortValue(b, sortKey);
      let cmp;
      if(typeof av === "string" || typeof bv === "string"){
        cmp = String(av).localeCompare(String(bv), "de");
      } else {
        cmp = av - bv;
      }
      return sortDir === "asc" ? cmp : -cmp;
    });
    return arr;
  }, [runs, sortKey, sortDir]);

  return html`
    <div>
    <section class="panel">
      <h2 class="panel-title">Import</h2>
      <div class="field-row" style="align-items:flex-start;">
        <label style="display:flex; align-items:center; gap:6px; min-width:auto;">
          <input type="checkbox" class="checkbox" checked=${onlyRuns} onChange=${e => setOnlyRuns(e.target.checked)} />
          Nur als Lauf gekennzeichnete Aktivitäten importieren
        </label>
      </div>
      <div class="field-row">
        <label>Min. Distanz</label>
        <input type="number" step="0.1" placeholder="keine" value=${minKm} onInput=${e => setMinKm(e.target.value)} style="width:80px" /> km
      </div>
      <div class="field-row">
        <label>Max. Distanz</label>
        <input type="number" step="0.1" placeholder="keine" value=${maxKm} onInput=${e => setMaxKm(e.target.value)} style="width:80px" /> km
      </div>
      <p class="hint">
        GPX- oder JSON-Dateien auswählen, z.B. aus dem Apple-Health- oder Garmin-Connect-Export.
      </p>
      <input type="file" ref=${fileRef} accept="application/json,.json,.gpx,application/gpx+xml" multiple onChange=${handleFileChange} />
    </section>
    <section class="panel">
      <h2 class="panel-title">Läufe <span class="n">${runs.length}</span></h2>
      ${runs.length === 0 ? html`<div class="empty">Noch keine Läufe importiert.</div>` : html`
        <p class="hint">Spaltenüberschriften antippen, um zu sortieren.</p>
        <div style="overflow-x:auto;">
        <table class="runs">
          <thead><tr>
            <th></th>
            <th onClick=${() => toggleSort("date")} style="cursor:pointer;">Datum${sortArrow("date")}</th>
            <th onClick=${() => toggleSort("distance")} style="cursor:pointer;">Distanz${sortArrow("distance")}</th>
            <th onClick=${() => toggleSort("duration")} style="cursor:pointer;">Dauer${sortArrow("duration")}</th>
            <th onClick=${() => toggleSort("pace")} style="cursor:pointer;">Ø Pace${sortArrow("pace")}</th>
            <th onClick=${() => toggleSort("location")} style="cursor:pointer;">Ort${sortArrow("location")}</th>
            <th onClick=${() => toggleSort("route")} style="cursor:pointer;">Route${sortArrow("route")}</th>
            <th></th>
          </tr></thead>
          <tbody>
            ${sortedRuns.map(r => html`
              <tr key=${r.id}>
                <td><input type="checkbox" class="checkbox" checked=${selected.has(r.id)} onChange=${() => onToggle(r.id)} /></td>
                <td>${fmtDate(r.start)}</td>
                <td>${fmtKm(r.distanceKm)}</td>
                <td>${fmtDuration(r.durationSec)}</td>
                <td>${fmtPace(r.avgPaceSecPerKm)}</td>
                <td>${r.route ? (r.location === undefined ? "…" : (r.location || "–")) : "–"}</td>
                <td>${r.route ? html`<span class="tag route-ok">GPS</span>` : html`<span class="tag">–</span>`}</td>
                <td><button class="btn danger small" onClick=${() => onDelete(r.id)}>löschen</button></td>
              </tr>
            `)}
          </tbody>
        </table>
        </div>
        <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
          <button class="btn small" onClick=${onShare}>📲 Auf anderes Gerät übertragen</button>
          <button class="btn ghost small" onClick=${onBackup}>💾 Backup (JSON)</button>
          <input type="file" ref=${restoreFileRef} accept="application/json,.json" style="display:none;" onChange=${onRestoreFileChange} />
          <button class="btn ghost small" onClick=${() => restoreFileRef.current && restoreFileRef.current.click()}>♻️ Wiederherstellen</button>
          <button class="btn danger small" onClick=${onClearAll}>Alle löschen</button>
        </div>
        <p class="hint" style="margin-top:8px;">"Auf anderes Gerät übertragen" öffnet die iOS-Teilen-Übersicht (z.B. AirDrop, Nachrichten, Mail) mit der Backup-Datei direkt im Gepäck. Auf dem Zielgerät die Datei öffnen bzw. in „Dateien" sichern und dort über „Wiederherstellen" importieren. "Wiederherstellen" ergänzt/überschreibt anhand der ID aus einer Backup-Datei — bestehende Daten, die nicht im Backup enthalten sind, bleiben unangetastet.</p>
      `}
    </section>
    </div>
  `;
}

const GARMIN_TYPE_OPTIONS = [
  { key: "", label: "Alle Typen" },
  { key: "running", label: "Laufen" },
  { key: "trail_running", label: "Trail Running" },
  { key: "cycling", label: "Radfahren" },
  { key: "mountain_biking", label: "Mountainbiking" },
  { key: "hiking", label: "Wandern" },
  { key: "walking", label: "Gehen" },
  { key: "swimming", label: "Schwimmen" },
  { key: "strength_training", label: "Krafttraining" },
  { key: "fitness_equipment", label: "Fitnessgerät" },
  { key: "other", label: "Sonstiges" },
];

function garminParseLocalTime(s){
  if(!s) return null;
  const d = new Date(String(s).replace(" ", "T"));
  return isNaN(d.getTime()) ? null : d;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

function GarminTab({ showToast }){
  const [authLoaded, setAuthLoaded] = useState(false);
  const [auth, setAuth] = useState(null); // {username, oauth1, oauth2}
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [loggingIn, setLoggingIn] = useState(false);
  const [loginError, setLoginError] = useState(null);

  const [syncState, setSyncState] = useState(null);
  const [exportedIds, setExportedIds] = useState(() => new Set());

  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState(todayStr());
  const [typeFilter, setTypeFilter] = useState("");
  const [onlyNotExported, setOnlyNotExported] = useState(true);

  const [activities, setActivities] = useState(null); // null = noch nicht geladen
  const [loadingList, setLoadingList] = useState(false);
  const [listProgress, setListProgress] = useState("");
  const [listError, setListError] = useState(null);

  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [downloading, setDownloading] = useState(false);
  const [downloadProgress, setDownloadProgress] = useState("");

  useEffect(() => {
    (async () => {
      const [a, sync, exported] = await Promise.all([idbGetGarminAuth(), idbGetGarminSync(), idbGetAllGarminActivities()]);
      if(a) setAuth(a);
      if(sync) {
        setSyncState(sync);
        if(sync.lastImportDate) setStartDate(sync.lastImportDate);
      }
      setExportedIds(new Set(exported.map(e => String(e.activityId))));
      setAuthLoaded(true);
    })();
  }, []);

  async function persistAuth(next){
    setAuth(next);
    await idbSetGarminAuth(next);
  }

  async function handleLogin(e){
    e.preventDefault();
    setLoggingIn(true); setLoginError(null);
    try{
      const data = await garminApi("login", { username, password });
      const next = { username, oauth1: data.oauth1, oauth2: data.oauth2, savedAt: new Date().toISOString() };
      await persistAuth(next);
      setPassword("");
      showToast(`Bei Garmin Connect angemeldet als ${username}.`);
    } catch(err){
      setLoginError(err.message);
    } finally {
      setLoggingIn(false);
    }
  }

  async function handleLogout(){
    if(!confirm("Garmin-Sitzung auf diesem Gerät abmelden? Für den nächsten Import ist dann wieder ein Login nötig.")) return;
    await idbClearGarminAuth();
    setAuth(null);
    setActivities(null);
    setSelectedIds(new Set());
  }

  async function loadActivities(){
    if(!startDate){
      setListError("Bitte ein Startdatum wählen.");
      return;
    }
    setLoadingList(true); setListError(null); setActivities(null); setSelectedIds(new Set());
    try{
      let tokenState = { oauth1: auth.oauth1, oauth2: auth.oauth2 };
      let all = [];
      let start = 0;
      const limit = 100;
      const maxPages = 30; // Sicherheitsgrenze: max. 3000 Aktivitäten pro Ladevorgang
      for(let page = 0; page < maxPages; page++){
        setListProgress(`Lade Aktivitäten… ${all.length} geladen`);
        const data = await garminApi("list", {
          oauth1: tokenState.oauth1, oauth2: tokenState.oauth2,
          start, limit, startDate, endDate,
        });
        if(data.oauth1) tokenState.oauth1 = data.oauth1;
        if(data.oauth2) tokenState.oauth2 = data.oauth2;
        const batch = data.activities || [];
        all = all.concat(batch);
        if(batch.length < limit) break;
        start += limit;
      }
      await persistAuth({ ...auth, oauth1: tokenState.oauth1, oauth2: tokenState.oauth2 });
      setActivities(all);
      setListProgress("");
      if(all.length === 0){
        showToast("Keine Aktivitäten im gewählten Zeitraum gefunden.");
      }
    } catch(err){
      setListError(err.message);
      setListProgress("");
    } finally {
      setLoadingList(false);
    }
  }

  const filteredActivities = useMemo(() => {
    if(!activities) return [];
    return activities.filter(a => {
      if(typeFilter && garminTypeLabel(a) !== typeFilter) return false;
      if(onlyNotExported && exportedIds.has(String(a.activityId))) return false;
      return true;
    });
  }, [activities, typeFilter, onlyNotExported, exportedIds]);

  function toggleActivitySelect(id){
    setSelectedIds(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }
  function selectAllVisible(){
    setSelectedIds(new Set(filteredActivities.map(a => a.activityId)));
  }
  function clearSelection(){
    setSelectedIds(new Set());
  }

  async function handleDownload(){
    const ids = [...selectedIds];
    if(ids.length === 0) return;
    setDownloading(true);
    let tokenState = { oauth1: auth.oauth1, oauth2: auth.oauth2 };
    const byId = new Map(activities.map(a => [a.activityId, a]));
    const succeeded = [];
    const failed = [];
    const batchSize = 15; // pro Server-Aufruf: GPX-Download + ZIP-Erstellung serverseitig
    let part = 0;
    const totalParts = Math.ceil(ids.length / batchSize);
    try{
      for(let i = 0; i < ids.length; i += batchSize){
        part++;
        const batch = ids.slice(i, i + batchSize);
        setDownloadProgress(`Lade & packe GPX-Dateien… ${i} von ${ids.length}`);
        const data = await garminApi("gpxzip", {
          oauth1: tokenState.oauth1, oauth2: tokenState.oauth2, activityIds: batch,
        });
        if(data.oauth1) tokenState.oauth1 = data.oauth1;
        if(data.oauth2) tokenState.oauth2 = data.oauth2;
        (data.included || []).forEach(id => succeeded.push(id));
        (data.failed || []).forEach(f => failed.push(f));

        if(data.zipBase64){
          const byteChars = atob(data.zipBase64);
          const bytes = new Uint8Array(byteChars.length);
          for(let j = 0; j < byteChars.length; j++) bytes[j] = byteChars.charCodeAt(j);
          const blob = new Blob([bytes], { type: "application/zip" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = totalParts > 1 ? `garmin-export-${todayStr()}-teil${part}.zip` : `garmin-export-${todayStr()}.zip`;
          link.click();
          URL.revokeObjectURL(url);
        }
      }
      await persistAuth({ ...auth, oauth1: tokenState.oauth1, oauth2: tokenState.oauth2 });

      if(succeeded.length > 0){
        const now = new Date().toISOString();
        const records = succeeded.map(id => ({ activityId: id, exportedAt: now }));
        await idbPutGarminActivities(records);
        setExportedIds(prev => { const n = new Set(prev); succeeded.forEach(id => n.add(String(id))); return n; });

        const maxDate = succeeded.reduce((max, id) => {
          const a = byId.get(id);
          const d = a && a.startTimeLocal ? a.startTimeLocal.slice(0,10) : null;
          return d && d > max ? d : max;
        }, syncState && syncState.lastImportDate || "");
        if(maxDate){
          const nextSync = { lastImportDate: maxDate };
          await idbSetGarminSync(nextSync);
          setSyncState(nextSync);
        }
        setSelectedIds(new Set());
      }

      const parts = [];
      if(succeeded.length) parts.push(`${succeeded.length} GPX-Datei(en)${totalParts > 1 ? ` in ${totalParts} ZIP-Dateien` : " als ZIP"} heruntergeladen`);
      if(failed.length) parts.push(`${failed.length} ohne GPS-Daten übersprungen`);
      showToast(parts.join(", ") + ".");
    } catch(err){
      showToast("Fehler beim Download: " + err.message);
    } finally {
      setDownloading(false);
      setDownloadProgress("");
    }
  }

  if(!authLoaded){
    return html`<div class="empty">Lädt…</div>`;
  }

  if(!auth){
    return html`
      <section class="panel">
        <h2 class="panel-title">Garmin Connect Login</h2>
        <p class="hint">
          Anmeldung erfolgt über eine eigene Vercel-Funktion (kein CORS-Problem), die Zugangsdaten
          werden nicht gespeichert — nur das resultierende Sitzungs-Token bleibt lokal auf diesem
          Gerät in IndexedDB (nie im Backup enthalten). Aus Rücksicht auf Garmins Login-Limits: nur
          einmal anmelden, danach wird die Sitzung wiederverwendet.
        </p>
        <form onSubmit=${handleLogin}>
          <div class="field-row">
            <label>E-Mail</label>
            <input type="email" required value=${username} onInput=${e => setUsername(e.target.value)} style="flex:1;" autocomplete="username" />
          </div>
          <div class="field-row">
            <label>Passwort</label>
            <input type="password" required value=${password} onInput=${e => setPassword(e.target.value)} style="flex:1;" autocomplete="current-password" />
          </div>
          ${loginError && html`<p class="hint" style="color:var(--route);">${loginError}</p>`}
          <button class="btn small" type="submit" disabled=${loggingIn}>${loggingIn ? "Melde an…" : "Anmelden"}</button>
        </form>
      </section>
    `;
  }

  return html`
    <div>
    <section class="panel">
      <h2 class="panel-title">Garmin Connect</h2>
      <p class="hint">
        Angemeldet als <b>${auth.username}</b>.
        ${syncState && syncState.lastImportDate ? html` Letzter Import bis einschließlich ${fmtDateOnly(syncState.lastImportDate)}.` : null}
      </p>
      <button class="btn ghost small" onClick=${handleLogout}>Abmelden</button>
    </section>

    <section class="panel">
      <h2 class="panel-title">Aktivitäten laden</h2>
      <div class="field-row">
        <label>Von</label>
        <input type="date" value=${startDate} onInput=${e => setStartDate(e.target.value)} />
      </div>
      <div class="field-row">
        <label>Bis</label>
        <input type="date" value=${endDate} onInput=${e => setEndDate(e.target.value)} />
      </div>
      <p class="hint">
        ${syncState && syncState.lastImportDate
          ? "Vorausgefüllt mit dem Datum des letzten Imports — bereits heruntergeladene Aktivitäten werden nicht erneut angezeigt (siehe Filter unten)."
          : "Beim ersten Import weit genug zurückgehen, z.B. Kontoerstellungsdatum."}
      </p>
      <button class="btn small" onClick=${loadActivities} disabled=${loadingList}>${loadingList ? (listProgress || "Lade…") : "Aktivitäten laden"}</button>
      ${listError && html`<p class="hint" style="color:var(--route);">${listError}</p>`}
    </section>

    ${activities !== null && html`
      <section class="panel">
        <h2 class="panel-title">Gefundene Aktivitäten <span class="n">${filteredActivities.length}</span></h2>
        <div class="field-row">
          <label>Typ</label>
          <select value=${typeFilter} onChange=${e => setTypeFilter(e.target.value)}>
            ${GARMIN_TYPE_OPTIONS.map(o => html`<option key=${o.key} value=${o.key}>${o.label}</option>`)}
          </select>
        </div>
        <div class="field-row" style="align-items:center;">
          <label style="display:flex; align-items:center; gap:6px; min-width:auto;">
            <input type="checkbox" class="checkbox" checked=${onlyNotExported} onChange=${e => setOnlyNotExported(e.target.checked)} />
            Nur noch nicht heruntergeladene anzeigen
          </label>
        </div>
        ${filteredActivities.length === 0 ? html`<div class="empty">Keine Aktivitäten mit diesem Filter.</div>` : html`
          <div style="overflow-x:auto;">
          <table class="runs">
            <thead><tr>
              <th></th>
              <th>Datum</th>
              <th>Dauer</th>
              <th>Länge</th>
              <th>Titel</th>
              <th>Ort</th>
              <th>Typ</th>
            </tr></thead>
            <tbody>
              ${filteredActivities.map(a => html`
                <tr key=${a.activityId}>
                  <td><input type="checkbox" class="checkbox" checked=${selectedIds.has(a.activityId)} onChange=${() => toggleActivitySelect(a.activityId)} /></td>
                  <td>${fmtDate(a.startTimeLocal)}</td>
                  <td>${fmtDuration(garminDurationSec(a))}</td>
                  <td>${fmtKm(garminDistanceKm(a))}</td>
                  <td>${a.activityName || "–"}</td>
                  <td>${a.locationName || "–"}</td>
                  <td>${garminTypeLabel(a)} ${exportedIds.has(String(a.activityId)) ? html`<span class="tag route-ok">✓</span>` : null}</td>
                </tr>
              `)}
            </tbody>
          </table>
          </div>
          <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
            <button class="btn ghost small" onClick=${selectAllVisible}>Alle sichtbaren auswählen</button>
            <button class="btn ghost small" onClick=${clearSelection}>Auswahl leeren</button>
            <button class="btn small" onClick=${handleDownload} disabled=${downloading || selectedIds.size === 0}>
              ${downloading ? (downloadProgress || "Lädt…") : `${selectedIds.size} als GPX herunterladen (ZIP)`}
            </button>
          </div>
          <p class="hint" style="margin-top:8px;">Download landet als eine ZIP-Datei im Safari-Downloads-Ordner. Aktivitäten ohne GPS-Daten (z.B. Krafttraining) werden übersprungen.</p>
        `}
      </section>
    `}
    </div>
  `;
}

function LaengeTab({ runs, selected, onToggle, onGoCompare }){
  const withDist = runs.filter(r => r.distanceKm);
  const [refKm, setRefKm] = useState(() => withDist.length ? Math.round(withDist[0].distanceKm*10)/10 : 10);
  const [tolerance, setTolerance] = useState(8);
  const [sortKey, setSortKey] = useState("diff");
  const [sortDir, setSortDir] = useState("asc");

  const matches = useMemo(() => {
    return runs.filter(r => r.distanceKm && Math.abs(r.distanceKm - refKm) / refKm <= tolerance/100);
  }, [runs, refKm, tolerance]);

  function toggleSort(key){
    if(sortKey === key){
      setSortDir(d => d === "asc" ? "desc" : "asc");
    } else {
      setSortKey(key);
      setSortDir(key === "date" ? "desc" : "asc");
    }
  }

  function sortArrow(key){
    return sortKey === key ? (sortDir === "asc" ? " ▲" : " ▼") : "";
  }

  function sortValue(r, key){
    switch(key){
      case "date": { const t = new Date(r.start).getTime(); return isNaN(t) ? 0 : t; }
      case "distance": return r.distanceKm ?? -1;
      case "duration": return r.durationSec ?? -1;
      case "pace": return r.avgPaceSecPerKm ?? -1;
      case "location": return r.location || "";
      case "diff": return Math.abs((r.distanceKm ?? 0) - refKm);
      default: return 0;
    }
  }

  const sortedMatches = useMemo(() => {
    const arr = [...matches];
    arr.sort((a,b) => {
      const av = sortValue(a, sortKey), bv = sortValue(b, sortKey);
      let cmp;
      if(typeof av === "string" || typeof bv === "string"){
        cmp = String(av).localeCompare(String(bv), "de");
      } else {
        cmp = av - bv;
      }
      return sortDir === "asc" ? cmp : -cmp;
    });
    return arr;
  }, [matches, sortKey, sortDir, refKm]);

  if(runs.length === 0) return html`<div class="empty">Erst Läufe importieren.</div>`;

  return html`
    <div>
    <section class="panel">
      <h2 class="panel-title">Ähnliche Länge finden</h2>
      <div class="field-row">
        <label>Ziel-Distanz</label>
        <input type="number" step="0.1" value=${refKm} onInput=${e => setRefKm(parseFloat(e.target.value)||0)} style="width:80px" /> km
      </div>
      <div class="field-row">
        <label>Toleranz</label>
        <input type="range" min="1" max="30" value=${tolerance} onInput=${e => setTolerance(parseInt(e.target.value))} />
        <span class="val">±${tolerance}%</span>
      </div>
      <p class="hint">Zeigt Läufe mit ${fmtKm(refKm*(1-tolerance/100))} – ${fmtKm(refKm*(1+tolerance/100))}.</p>
    </section>
    <section class="panel">
      <h2 class="panel-title">Treffer <span class="n">${matches.length}</span></h2>
      ${matches.length === 0 ? html`<div class="empty">Keine Läufe in diesem Bereich.</div>` : html`
        <p class="hint">Spaltenüberschriften antippen, um zu sortieren.</p>
        <div style="overflow-x:auto;">
        <table class="runs">
          <thead><tr>
            <th></th>
            <th onClick=${() => toggleSort("date")} style="cursor:pointer;">Datum${sortArrow("date")}</th>
            <th onClick=${() => toggleSort("distance")} style="cursor:pointer;">Distanz${sortArrow("distance")}</th>
            <th onClick=${() => toggleSort("duration")} style="cursor:pointer;">Dauer${sortArrow("duration")}</th>
            <th onClick=${() => toggleSort("pace")} style="cursor:pointer;">Ø Pace${sortArrow("pace")}</th>
            <th onClick=${() => toggleSort("location")} style="cursor:pointer;">Ort${sortArrow("location")}</th>
          </tr></thead>
          <tbody>
            ${sortedMatches.map(r => html`
              <tr key=${r.id}>
                <td><input type="checkbox" class="checkbox" checked=${selected.has(r.id)} onChange=${() => onToggle(r.id)} /></td>
                <td>${fmtDate(r.start)}</td>
                <td>${fmtKm(r.distanceKm)}</td>
                <td>${fmtDuration(r.durationSec)}</td>
                <td>${fmtPace(r.avgPaceSecPerKm)}</td>
                <td>${r.route ? (r.location === undefined ? "…" : (r.location || "–")) : "–"}</td>
              </tr>
            `)}
          </tbody>
        </table>
        </div>
        <button class="btn small" style="margin-top:10px" onClick=${onGoCompare}>Ausgewählte zum Vergleich →</button>
      `}
    </section>
    </div>
  `;
}

function KurseTab({ runs, selected, onToggle, onGoCompare }){
  const [threshold, setThreshold] = useState(100);
  const [distTol, setDistTol] = useState(15);
  const withRoute = runs.filter(r => r.route && r.route.length > 5);

  const withDist = withRoute.filter(r => r.distanceKm);
  const [refKm, setRefKm] = useState(() => withDist.length ? Math.round(withDist[0].distanceKm*10)/10 : 10);
  const [lenTolerance, setLenTolerance] = useState(8);

  const lengthFiltered = useMemo(() => {
    return withRoute.filter(r => r.distanceKm && Math.abs(r.distanceKm - refKm) / refKm <= lenTolerance/100);
  }, [withRoute, refKm, lenTolerance]);

  const clusters = useMemo(() => detectCourses(lengthFiltered, threshold, distTol), [lengthFiltered, threshold, distTol]);

  if(withRoute.length < 2) return html`<div class="empty">Mindestens zwei Läufe mit GPS-Route nötig.</div>`;

  return html`
    <div>
    <section class="panel">
      <h2 class="panel-title">Ähnliche Länge finden</h2>
      <div class="field-row">
        <label>Ziel-Distanz</label>
        <input type="number" step="0.1" value=${refKm} onInput=${e => setRefKm(parseFloat(e.target.value)||0)} style="width:80px" /> km
      </div>
      <div class="field-row">
        <label>Toleranz</label>
        <input type="range" min="1" max="30" value=${lenTolerance} onInput=${e => setLenTolerance(parseInt(e.target.value))} />
        <span class="val">±${lenTolerance}%</span>
      </div>
      <p class="hint">Nur Läufe mit ${fmtKm(refKm*(1-lenTolerance/100))} – ${fmtKm(refKm*(1+lenTolerance/100))} fließen unten in die Kurserkennung ein (${lengthFiltered.length} von ${withRoute.length} Läufen mit GPS-Route).</p>
    </section>
    <section class="panel">
      <h2 class="panel-title">Kurserkennung</h2>
      <p class="hint">
        Läufe werden anhand der Streckenform gruppiert (Start/Verlauf/Ziel, distanz-normalisiert, Richtung wird
        automatisch berücksichtigt). <b>Das ist eine Heuristik</b> — ohne echte Testdaten aus deinem Export nicht
        kalibriert. Bei Bedarf Schwellwerte anpassen.
      </p>
      <div class="field-row">
        <label>Form-Toleranz</label>
        <input type="range" min="20" max="300" step="10" value=${threshold} onInput=${e => setThreshold(parseInt(e.target.value))} />
        <span class="val">${threshold} m</span>
      </div>
      <div class="field-row">
        <label>Paar-Toleranz</label>
        <input type="range" min="2" max="40" value=${distTol} onInput=${e => setDistTol(parseInt(e.target.value))} />
        <span class="val">±${distTol}%</span>
      </div>
      <p class="hint">Zusätzliche Toleranz beim direkten Vergleich einzelner Lauf-Paare, unabhängig vom Längenfilter oben.</p>
    </section>
    <section class="panel">
      <h2 class="panel-title">Erkannte Kurse <span class="n">${clusters.length}</span></h2>
      ${clusters.length === 0 ? html`<div class="empty">Keine wiederkehrenden Kurse mit diesen Einstellungen gefunden.</div>` : clusters.map(group => html`
        <div class="course-card" key=${group[0]._courseLabel}>
          <div class="head">
            <span class="name">${group[0].location === undefined ? "Ort wird ermittelt…" : (group[0].location || group[0]._courseLabel)} <span class="mono" style="font-size:10px;color:var(--muted-2);font-style:normal;">(${group[0]._courseLabel})</span></span>
            <span class="meta">${group.length} Läufe · Ø ${fmtKm(group.reduce((s,r)=>s+r.distanceKm,0)/group.length)}</span>
          </div>
          ${group.sort((a,b)=>new Date(b.start)-new Date(a.start)).map(r => html`
            <div key=${r.id} style="display:flex; align-items:center; gap:8px; padding:3px 0; font-size:12px;" class="mono">
              <input type="checkbox" class="checkbox" checked=${selected.has(r.id)} onChange=${() => onToggle(r.id)} />
              <span style="flex:1">${fmtDate(r.start)}</span>
              <span>${fmtKm(r.distanceKm)}</span>
              <span>${fmtDuration(r.durationSec)}</span>
              <span>${fmtPace(r.avgPaceSecPerKm)}</span>
            </div>
          `)}
        </div>
      `)}
      ${clusters.length > 0 && html`<button class="btn small" onClick=${onGoCompare}>Ausgewählte zum Vergleich →</button>`}
    </section>
    </div>
  `;
}

function VergleichTab({ runs, selected, onToggle, comparisons, activeComparisonId, onSave, onSaveAsNew, onLoad, onDelete, onRename, onClose }){
  const selRuns = runs.filter(r => selected.has(r.id)).sort((a,b) => new Date(a.start)-new Date(b.start));
  const selWithRoute = selRuns.filter(r => r.route && r.hasTime);
  const [pairA, setPairA] = useState(null);
  const [pairB, setPairB] = useState(null);
  const [showMapTiles, setShowMapTiles] = useState(false);
  const activeComparison = (comparisons || []).find(c => c.id === activeComparisonId) || null;
  const [nameInput, setNameInput] = useState(activeComparison ? activeComparison.name : "");
  const [notesInput, setNotesInput] = useState(activeComparison ? activeComparison.notes : "");
  const [comparisonSort, setComparisonSort] = useState("updated");
  const [comparisonsExpanded, setComparisonsExpanded] = useState(true);

  useEffect(() => {
    setNameInput(activeComparison ? (activeComparison.name || "") : "");
    setNotesInput(activeComparison ? (activeComparison.notes || "") : "");
  }, [activeComparisonId]);

  useEffect(() => {
    if(selWithRoute.length >= 2){
      if(!pairA || !selWithRoute.find(r=>r.id===pairA)) setPairA(selWithRoute[0].id);
      if(!pairB || !selWithRoute.find(r=>r.id===pairB)) setPairB(selWithRoute[1].id);
    }
  }, [selWithRoute.map(r=>r.id).join(",")]);

  const noSelection = selRuns.length === 0;

  const BIN_M = 25;
  const overlayData = useMemo(() => {
    return selWithRoute.map((r,i) => ({
      run: r, color: COLORS[i % COLORS.length],
      bins: resampleByDistance(r.route, BIN_M),
    }));
  }, [selWithRoute.map(r=>r.id).join(",")]);

  const wegZeitSeries = overlayData.map(o => ({ color: o.color, points: o.bins.map(b => ({ x: b.distKm, y: b.t })) }));
  const hasElevation = overlayData.some(o => o.bins.some(b => b.ele != null));
  const elevSeries = overlayData.map(o => ({ color: o.color, points: o.bins.map(b => ({ x: b.distKm, y: b.ele })) }));
  const splitSeries = overlayData
    .map(o => ({ color: o.color, points: (o.run.splits || []).map(sp => ({ x: sp.km, y: sp.paceSecPerKm })) }))
    .filter(s => s.points.length > 0);
  const mapSeries = overlayData.map(o => ({ color: o.color, points: downsampleRoute(o.run.route, 300).map(p => ({ lat: p.lat, lon: p.lon })) }));
  const mapLocation = selWithRoute.length ? selWithRoute[0].location : undefined;

  const runA = runs.find(r => r.id === pairA);
  const runB = runs.find(r => r.id === pairB);
  let diffPoints = null, splitLabels = null, splitDiffs = null;
  if(runA && runB && runA.route && runB.route){
    const binsA = resampleByDistance(runA.route, BIN_M);
    const binsB = resampleByDistance(runB.route, BIN_M);
    const maxCommon = Math.min(
      binsA.length ? binsA[binsA.length-1].distKm : 0,
      binsB.length ? binsB[binsB.length-1].distKm : 0
    );
    diffPoints = [];
    for(const b of binsA){
      if(b.distKm > maxCommon) break;
      const match = binsB.find(x => x.distKm >= b.distKm) || binsB[binsB.length-1];
      if(match) diffPoints.push({ x: b.distKm, y: b.t - match.t });
    }
    const splitsA = runA.splits || [], splitsB = runB.splits || [];
    const nSplits = Math.min(splitsA.length, splitsB.length);
    splitLabels = []; splitDiffs = [];
    for(let i=0;i<nSplits;i++){
      splitLabels.push(`${i+1}`);
      splitDiffs.push(splitsA[i].paceSecPerKm - splitsB[i].paceSecPerKm);
    }
  }

  const sortedComparisons = useMemo(() => {
    const arr = [...(comparisons || [])];
    switch(comparisonSort){
      case "alpha":
        arr.sort((a,b) => (a.name || "Ohne Namen").localeCompare(b.name || "Ohne Namen", "de"));
        break;
      case "created":
        arr.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
        break;
      default: // "updated"
        arr.sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    }
    return arr;
  }, [comparisons, comparisonSort]);

  return html`
    <div>
    <section class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:${comparisonsExpanded ? "12px" : "0"};">
        <h2 class="panel-title" style="margin:0;">Gespeicherte Vergleiche <span class="n">${(comparisons||[]).length}</span></h2>
        <div style="display:flex; align-items:center; gap:8px;">
          ${(comparisons||[]).length > 1 && html`
            <select value=${comparisonSort} onChange=${e => setComparisonSort(e.target.value)} style="font-size:11px; padding:5px 7px;">
              <option value="updated">Zuletzt geändert</option>
              <option value="alpha">Alphabetisch (A–Z)</option>
              <option value="created">Erstellungsreihenfolge</option>
            </select>
          `}
          ${(comparisons||[]).length > 0 && html`
            <button class="btn ghost small" onClick=${() => setComparisonsExpanded(v => !v)}>${comparisonsExpanded ? "▲ Einklappen" : "▼ Ausklappen"}</button>
          `}
        </div>
      </div>
      ${!comparisonsExpanded ? null : (comparisons||[]).length === 0 ? html`<div class="empty">Noch keine Vergleiche gespeichert.</div>` : sortedComparisons.map(c => html`
        <div class="course-card" key=${c.id}>
          <div class="head">
            <span class="name">${c.name || "Ohne Namen"}${c.id === activeComparisonId ? " (aktiv)" : ""}</span>
            <span class="meta">${c.runIds.length} Läufe · ${fmtDateOnly(c.updatedAt)}</span>
          </div>
          ${c.notes ? html`<p class="hint" style="white-space:pre-wrap; margin:4px 0 10px 0;">${c.notes}</p>` : null}
          <div style="display:flex; gap:8px;">
            <button class="btn small" onClick=${() => onLoad(c.id)}>Laden</button>
            <button class="btn ghost small" onClick=${() => onRename(c.id, c.name)}>✏️ Umbenennen</button>
            <button class="btn danger small" onClick=${() => onDelete(c.id)}>Löschen</button>
          </div>
        </div>
      `)}
    </section>

    ${noSelection ? html`<div class="empty">Noch keine Läufe ausgewählt. In „Läufe", „Ähnliche Länge" oder „Kurse" per Checkbox auswählen.</div>` : html`
    <section class="panel">
      <h2 class="panel-title">Auswahl <span class="n">${selRuns.length}</span></h2>
      <div class="chips">
        ${selRuns.map((r,i) => html`
          <div class="chip" key=${r.id}>
            ${r.route ? html`<span class="swatch" style=${{background: COLORS[selWithRoute.findIndex(x=>x.id===r.id) % COLORS.length]}}></span>` : ""}
            <span>${fmtDateOnly(r.start)} · ${fmtKm(r.distanceKm)} · ${fmtDuration(r.durationSec)}${r.route ? html` · ${r.location === undefined ? "…" : (r.location || "Ort unbekannt")}` : ""}</span>
            <button onClick=${() => onToggle(r.id)}>✕</button>
          </div>
        `)}
      </div>
      ${selWithRoute.length === 0 && html`<p class="hint">Keiner der ausgewählten Läufe hat eine nutzbare GPS-Zeitreihe — Diagramme benötigen Route + Zeitstempel.</p>`}
    </section>

    ${selWithRoute.length > 0 && html`
      <section class="panel">
        <h2 class="panel-title">Karte</h2>
        <div class="location-tag">📍 ${mapLocation === undefined ? "Ort wird ermittelt…" : (mapLocation || "Ort unbekannt")}</div>
        <p class="hint">Alle ausgewählten Kurse überlagert (Punkt = Start), gleiche Farben wie oben. Ortsangabe bezieht sich auf den Startpunkt des ersten ausgewählten Laufs.</p>
        <label style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); margin-bottom:8px;">
          <input type="checkbox" class="checkbox" checked=${showMapTiles} onChange=${e => setShowMapTiles(e.target.checked)} />
          Kartenhintergrund anzeigen (lädt Kartenkacheln von OpenStreetMap)
        </label>
        <div class="chart-wrap"><${RouteMap} series=${mapSeries} showTiles=${showMapTiles} /></div>
      </section>
    `}

    ${selWithRoute.length > 0 && html`
      <section class="panel">
        <h2 class="panel-title">Weg-Zeit-Diagramm</h2>
        <p class="hint">Alle ausgewählten Läufe überlagert, X-Achse = Distanz. Steilere Linie = langsamer.</p>
        <div class="chart-wrap"><${MultiLineChart} series=${wegZeitSeries} yFormat=${fmtDuration} xFormat=${v=>v.toFixed(1)} xLabel="Distanz (km)" yLabel="Zeit (mm:ss)" /></div>
        ${hasElevation ? html`
          <div class="chart-wrap" style="margin-top:18px;">
            <${MultiLineChart} series=${elevSeries} height=${150} yFormat=${v=>Math.round(v)} xFormat=${v=>v.toFixed(1)} xLabel="Distanz (km)" yLabel="Höhe (m)" />
            <div class="cap">Höhenprofil, gleiche Distanz-Achse wie oben</div>
          </div>
        ` : html`<p class="hint" style="margin-top:10px;">Keine Höhendaten in der Route gefunden.</p>`}
      </section>
    `}

    ${splitSeries.length > 0 && html`
      <section class="panel">
        <h2 class="panel-title">Km-Splits (absolut)</h2>
        <p class="hint">Tempo je Kilometer für jeden ausgewählten Lauf, gleiche Farben wie oben.</p>
        <div class="chart-wrap"><${MultiLineChart} series=${splitSeries} yFormat=${v => { const m=Math.floor(v/60), s=Math.round(v%60); return `${m}:${String(s).padStart(2,"0")}`; }} xFormat=${v=>v.toFixed(0)} xLabel="Kilometer" yLabel="Pace (min/km)" /></div>
      </section>
    `}

    ${selWithRoute.length >= 2 && html`
      <section class="panel">
        <h2 class="panel-title">Differenz zweier Läufe</h2>
        <select class="pair-select" value=${pairA} onChange=${e => setPairA(e.target.value)}>
          ${selWithRoute.map(r => html`<option key=${r.id} value=${r.id}>A: ${fmtDateOnly(r.start)} · ${fmtKm(r.distanceKm)} · ${fmtDuration(r.durationSec)}${r.location ? ` · ${r.location}` : ""}</option>`)}
        </select>
        <select class="pair-select" value=${pairB} onChange=${e => setPairB(e.target.value)}>
          ${selWithRoute.map(r => html`<option key=${r.id} value=${r.id}>B: ${fmtDateOnly(r.start)} · ${fmtKm(r.distanceKm)} · ${fmtDuration(r.durationSec)}${r.location ? ` · ${r.location}` : ""}</option>`)}
        </select>
        ${diffPoints && runA && runB && html`
          <div class="stat-grid">
            <div class="stat"><div class="lbl">Dauer A</div><div class="v">${fmtDuration(runA.durationSec)}</div></div>
            <div class="stat"><div class="lbl">Dauer B</div><div class="v">${fmtDuration(runB.durationSec)}</div></div>
            <div class="stat"><div class="lbl">Differenz</div><div class="v">${runA.durationSec-runB.durationSec>0?"+":""}${fmtDuration(Math.abs(runA.durationSec-runB.durationSec))}</div></div>
          </div>
          <p class="hint">Positiv = A war an dieser Stelle langsamer (mehr Zeit) als B.</p>
          <div class="chart-wrap"><${AreaChartZero} points=${diffPoints} color="#C97A3D" xLabel="Distanz (km)" yLabel="Zeitdifferenz (s)" /></div>
          ${splitLabels && splitLabels.length > 0 && html`
            <h2 class="panel-title" style="margin-top:20px;">Split-Tempo-Differenz</h2>
            <p class="hint">Wert je Balken in Sekunden. Positiv = A war in diesem Kilometer langsamer als B.</p>
            <div class="chart-wrap"><${BarChart} labels=${splitLabels} values=${splitDiffs} xLabel="Kilometer" yLabel="Pace-Differenz (s/km)" /></div>
          `}
        `}
      </section>
    `}

    <section class="panel">
      <h2 class="panel-title">${activeComparison ? "Vergleich bearbeiten" : "Vergleich speichern"}</h2>
      ${activeComparison ? html`<p class="hint">Bearbeitest „${activeComparison.name || "Ohne Namen"}". <button class="btn ghost small" onClick=${onClose} style="margin-left:8px;">Schließen</button></p>` : null}
      <div class="field-row">
        <label>Name</label>
        <input type="text" value=${nameInput} onInput=${e => setNameInput(e.target.value)} style="flex:1;" placeholder="z.B. Herbstformkurve 10K" />
      </div>
      <label style="font-size:11.5px; color:var(--muted); display:block; margin-bottom:4px;">Notizen</label>
      <textarea value=${notesInput} onInput=${e => setNotesInput(e.target.value)} rows="3" style="width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--fg); border-radius:4px; padding:8px; font-family:inherit; font-size:12.5px; resize:vertical;" placeholder="Freie Notizen zu diesem Vergleich…"></textarea>
      <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
        <button class="btn small" onClick=${() => onSave(nameInput, notesInput)}>${activeComparison ? "Aktualisieren" : "Speichern"}</button>
        ${activeComparison ? html`<button class="btn ghost small" onClick=${() => onSaveAsNew(nameInput, notesInput)}>Als neuen Vergleich speichern</button>` : null}
      </div>
    </section>
    `}
    </div>
  `;
}

preact.render(html`<${App} />`, document.getElementById("root"));
} catch(err){
  window.__appError = (err && err.message ? err.message : String(err)) + (err && err.stack ? "\n\n" + err.stack.split("\n").slice(0,6).join("\n") : "");
  if(typeof showFallbackError === "function") showFallbackError();
}

</script>
</body>
</html>
